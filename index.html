<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Маяк</title>
<meta name="theme-color" content="#0a0118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Маяк">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap">

<style>
:root{
--bg:#0a0118;--void:#0c0616;
--acc:#713dff;--acc2:#8562ff;--acc3:#b7a4fb;
--accg:linear-gradient(135deg,#8562ff,#713dff);
--t1:#ffffff;--t2:#d2d0dd;--t3:#9b96b0;--t4:#85808c;--t5:#5d5872;
--gl:rgba(255,255,255,.04);--gl2:rgba(255,255,255,.07);
--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.16);
--health:#3ddc97;--business:#5b9cff;--finance:#f5c451;--love:#ff6b9d;--self:#b7a4fb;--travel:#4ecdc4;
--ok:#3ddc97;--bad:#ff6b9d;
--fd:'Sora',system-ui,sans-serif;--fu:'Inter',system-ui,sans-serif;
--e:cubic-bezier(.22,.61,.36,1);--eo:cubic-bezier(.16,1,.3,1);
--r:16px;--rp:999px;--ro:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t1);font-family:var(--fu);font-size:16px;line-height:1.5;
 -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
::selection{background:rgba(113,61,255,.35)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dsp{font-family:var(--fd);font-weight:700;letter-spacing:-.02em}

/* ---------- SHELL + PURPLE BLOOM ---------- */
.phone{position:relative;width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
 background:var(--bg);isolation:isolate}
.phone::after{content:'';position:absolute;left:50%;bottom:-34%;transform:translateX(-50%);
 width:150%;height:62%;pointer-events:none;z-index:0;
 background:radial-gradient(ellipse at 50% 100%,rgba(113,61,255,.34),rgba(113,61,255,.1) 42%,transparent 70%);
 filter:blur(28px)}
.sbar{display:none}
.app{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;z-index:1}
.app::-webkit-scrollbar{width:0}
@media(min-width:900px){
 body{display:grid;place-items:center;height:100vh;background:#07010f}
 .phone{width:392px;height:848px;border-radius:46px;border:1px solid var(--bd);
  box-shadow:0 0 0 10px #130b24,0 0 0 11px rgba(255,255,255,.07),0 0 90px rgba(113,61,255,.22)}
 .sbar{display:flex;align-items:center;justify-content:space-between;padding:14px 26px 4px;
  font-size:13px;font-weight:600;flex-shrink:0;position:relative;z-index:2}
}

.scr{padding:0 0 96px;animation:si .3s var(--eo)}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:0 20px}

/* ---------- BARS ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 20px 16px}
.hello{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.025em;line-height:1.2}
.hsub{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:13px;color:var(--t3);
 background:var(--gl);border:1px solid var(--bd);padding:6px 13px;border-radius:var(--rp)}
.hsub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--acc2);box-shadow:0 0 8px var(--acc2)}
.icobtn{width:36px;height:36px;border-radius:var(--rp);display:grid;place-items:center;color:var(--t2);
 background:var(--gl);border:1px solid var(--bd);flex-shrink:0;transition:.2s}
.icobtn:active{transform:scale(.92);background:var(--gl2)}
.navbar{display:flex;align-items:center;gap:12px;padding:12px 20px 14px}
.backb{width:36px;height:36px;border-radius:var(--rp);display:grid;place-items:center;background:var(--gl);
 border:1px solid var(--bd);color:var(--t1);flex-shrink:0;font-size:18px;transition:.2s}
.backb:active{transform:scale(.92)}
.nb-c{flex:1;min-width:0;text-align:center}
.nb-t{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-s{font-size:13px;color:var(--t4);margin-top:1px}
.scr-t{font-family:var(--fd);font-weight:700;font-size:28px;letter-spacing:-.03em;padding:12px 20px 18px}
.lead{font-size:14px;color:var(--t3);padding:0 20px 18px;line-height:1.55}

/* ---------- GLASS CARD ---------- */
.g{background:var(--gl);border:1px solid var(--bd);border-radius:var(--r)}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 18px}
.pill{background:var(--gl);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.pill-i{font-size:16px;margin-bottom:8px;opacity:.9}
.pill-v{font-family:var(--fd);font-weight:700;font-size:24px;letter-spacing:-.03em;line-height:1}
.pill-l{font-size:13px;color:var(--t4);margin-top:5px;line-height:1.35}

/* ---------- MIND MAP ---------- */
/* pan-y: страница листается пальцем поверх карты; карта двигается двумя пальцами */
.mapwrap{position:relative;height:426px;overflow:hidden;touch-action:pan-y}
.mapcv{position:absolute;inset:0;transform-origin:0 0;transition:transform .55s var(--eo)}
.mapcv.nt{transition:none}
.wires{position:absolute;inset:0;overflow:visible;pointer-events:none}
.wire{fill:none;stroke-width:1.2;opacity:.3}
.wireb{fill:none;stroke-width:5;opacity:.07;filter:blur(4px)}
.pulse{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:3 24;opacity:.9}
.core{position:absolute;transform:translate(-50%,-50%);width:116px;height:116px;border-radius:50%;
 display:grid;place-items:center;text-align:center;cursor:pointer;
 background:radial-gradient(circle at 50% 45%,rgba(133,98,255,.42),rgba(113,61,255,.12) 58%,transparent 74%);
 border:1px solid rgba(183,164,251,.38)}
.core::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(183,164,251,.16);
 animation:halo 4.5s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.08);opacity:.16}}
.core-i{font-family:var(--fd);font-weight:700;font-size:32px;line-height:1;color:#fff}
.core-l{font-size:9px;font-weight:600;letter-spacing:.22em;color:var(--acc3);margin-top:5px}
.node{position:absolute;transform:translate(-50%,-50%);width:88px;padding:11px 8px;border-radius:var(--r);
 background:rgba(255,255,255,.05);border:1px solid var(--nl);text-align:center;cursor:pointer;
 backdrop-filter:blur(8px);will-change:transform;
 transition:transform .16s var(--e),box-shadow .16s,border-color .16s,background .16s}
.node-i{width:28px;height:28px;margin:0 auto 7px;border-radius:var(--ro);display:grid;place-items:center;
 font-size:14px;background:var(--nb)}
.node-n{font-size:11px;font-weight:600;line-height:1.2;color:var(--t2)}
.node-p{font-family:var(--fd);font-weight:700;font-size:12px;margin-top:4px;color:var(--nc)}
.fab{position:absolute;right:18px;bottom:16px;width:52px;height:52px;border-radius:var(--rp);display:grid;
 place-items:center;background:var(--accg);color:#fff;font-size:26px;font-weight:300;z-index:5;
 border:1px solid rgba(255,255,255,.18);transition:.2s}
.fab:active{transform:scale(.92)}
.maphint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12px;color:var(--t5);pointer-events:none}

/* ---------- SECTIONS / ROWS ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 10px}
.sec-t{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t4)}
.sec-x{font-size:13px;color:var(--t4)}
.rows{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--r);
 background:var(--gl);border:1px solid var(--bd);transition:.18s;text-align:left;width:100%}
.row:active{background:var(--gl2);transform:scale(.99)}
.row-i{width:38px;height:38px;border-radius:var(--ro);display:grid;place-items:center;font-size:16px;
 background:var(--nb);flex-shrink:0}
.row-b{flex:1;min-width:0}
.row-n{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:13px;color:var(--t4);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-p{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--nc);flex-shrink:0}
.row-c{color:var(--t5);flex-shrink:0;font-size:17px}
.bar{height:5px;border-radius:var(--rp);background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:var(--rp);background:var(--nc);transition:width .7s var(--eo)}

/* big goal card */
.gcard{display:block;width:100%;text-align:left;padding:18px;border-radius:var(--r);
 background:var(--gl);border:1px solid var(--bd);transition:.18s}
.gcard:active{background:var(--gl2);transform:scale(.99)}
.gc-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.gc-i{width:40px;height:40px;border-radius:var(--ro);display:grid;place-items:center;font-size:17px;
 background:var(--nb);flex-shrink:0}
.gc-n{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.02em;line-height:1.25}
.gc-w{font-size:13px;color:var(--t4);margin-top:4px;line-height:1.45}
.gc-p{font-family:var(--fd);font-weight:700;font-size:22px;color:var(--nc);flex-shrink:0;letter-spacing:-.02em}
.gc-m{display:flex;align-items:center;gap:14px;margin-top:12px;font-size:12.5px;color:var(--t4)}
.gc-m b{color:var(--t2);font-weight:600}

/* task */
.task{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:var(--r);background:var(--gl);
 border:1px solid var(--bd);width:100%;text-align:left;transition:.18s}
.task:active{transform:scale(.99)}
.cb{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--bd2);display:grid;place-items:center;
 flex-shrink:0;font-size:12px;color:transparent;transition:.2s}
.task.on .cb{background:var(--accg);border-color:transparent;color:#fff}
.task.on .task-n{color:var(--t4);text-decoration:line-through;text-decoration-color:var(--t5)}
.task-n{flex:1;font-size:15px;font-weight:500;min-width:0}
.api{font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:var(--rp);
 background:rgba(113,61,255,.2);color:var(--acc3);text-transform:uppercase;flex-shrink:0}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:5px;margin:0 20px 18px;padding:5px;background:var(--gl);border:1px solid var(--bd);
 border-radius:var(--rp)}
.tab{flex:1;padding:10px 6px;border-radius:var(--rp);font-size:13.5px;font-weight:600;color:var(--t4);
 transition:.2s;text-align:center}
.tab.on{background:var(--accg);color:#fff}

/* ---------- BUTTONS ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--rp);
 font-size:15px;font-weight:600;transition:.2s;width:100%}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--accg);color:#fff;border:1px solid rgba(255,255,255,.16)}
.btn.o{background:var(--gl);border:1px solid var(--bd);color:var(--t1)}
.btn.dash{background:transparent;border:1.4px dashed var(--bd2);color:var(--t3);font-weight:500}
.btn.sm{padding:11px 18px;font-size:14px;width:auto}
.btn.dg{background:rgba(255,107,157,.12);border:1px solid rgba(255,107,157,.3);color:var(--bad)}

/* ---------- RING ---------- */
.ring-w{display:flex;align-items:center;gap:20px;padding:4px 20px 20px}
.ring{position:relative;flex-shrink:0}
.ring-t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.03em}
.ring-s{font-size:14px;color:var(--t3);line-height:1.6}
.ring-s b{color:var(--t1);font-weight:600}

/* ---------- CALENDAR ---------- */
.cal{padding:0 20px}
.cal-m{font-family:var(--fd);font-weight:700;font-size:16px;margin-bottom:14px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-d{font-size:11px;color:var(--t5);text-align:center;font-weight:600;padding-bottom:3px}
.cal-c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:500;
 color:var(--t4);background:var(--gl)}
.cal-c.d{background:rgba(61,220,151,.16);color:var(--health)}
.cal-c.m{background:rgba(255,107,157,.14);color:var(--bad)}
.cal-c.t{border:1.5px solid var(--acc2);color:var(--acc3);background:rgba(113,61,255,.14)}
.cal-c.e{background:transparent}
.legend{display:flex;gap:18px;justify-content:center;padding:18px 0 0;font-size:12.5px;color:var(--t4)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* ---------- ACHIEVEMENTS ---------- */
.ach-g{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:0 20px}
.ach{padding:16px 8px;border-radius:var(--r);background:var(--gl);border:1px solid var(--bd);text-align:center;transition:.2s}
.ach:active{transform:scale(.96)}
.ach-i{width:46px;height:46px;margin:0 auto 9px;border-radius:var(--ro);display:grid;place-items:center;
 font-size:21px;background:var(--ab,rgba(113,61,255,.16))}
.ach.lock .ach-i{background:var(--gl);filter:grayscale(1);opacity:.35}
.ach.lock .ach-n,.ach.lock .ach-d{opacity:.4}
.ach-n{font-size:12px;font-weight:600;line-height:1.25}
.ach-d{font-size:11px;color:var(--t4);margin-top:4px;line-height:1.3}

/* ---------- HISTORY ---------- */
.hrow{display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--r);background:var(--gl);border:1px solid var(--bd)}
.hdot{width:10px;height:10px;border-radius:50%;background:var(--nc);flex-shrink:0}
.hn{flex:1;font-size:15px;font-weight:500}
.hd{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--ok)}

/* ---------- PROFILE ---------- */
.pf{display:flex;align-items:center;gap:16px;padding:4px 20px 22px}
.pf-a{width:60px;height:60px;border-radius:50%;background:var(--accg);display:grid;place-items:center;
 font-family:var(--fd);font-weight:700;font-size:23px;color:#fff;flex-shrink:0;background-size:cover;background-position:center}
.pf-n{font-family:var(--fd);font-weight:700;font-size:19px;letter-spacing:-.02em}
.pf-e{font-size:13.5px;color:var(--t4);margin-top:2px}
.pf-s{display:grid;grid-template-columns:repeat(3,1fr);margin:0 20px 20px;background:var(--gl);
 border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.pf-si{padding:17px 6px;text-align:center;border-right:1px solid var(--bd)}
.pf-si:last-child{border-right:none}
.pf-sv{font-family:var(--fd);font-weight:700;font-size:21px;letter-spacing:-.02em}
.pf-sl{font-size:11.5px;color:var(--t4);margin-top:3px}
.menu{padding:0 20px;display:flex;flex-direction:column;gap:3px}
.mi{display:flex;align-items:center;gap:14px;padding:16px 14px;border-radius:var(--ro);width:100%;text-align:left;transition:.18s}
.mi:active{background:var(--gl)}
.mi-i{width:22px;text-align:center;color:var(--t3);font-size:16px;flex-shrink:0}
.mi-n{flex:1;font-size:15px;font-weight:500}
.mi-v{font-size:13.5px;color:var(--t4)}
.mi.red .mi-n,.mi.red .mi-i{color:var(--bad)}
.msep{height:1px;background:var(--bd);margin:10px 14px}

/* ---------- SETTINGS ---------- */
.srow{display:flex;align-items:center;gap:14px;padding:17px 16px;border-radius:var(--r);
 background:var(--gl);border:1px solid var(--bd);margin-bottom:10px}
.s-b{flex:1;min-width:0}
.s-n{font-size:15px;font-weight:500}
.s-d{font-size:13px;color:var(--t4);margin-top:3px;line-height:1.4}
.sw{width:46px;height:27px;border-radius:var(--rp);background:rgba(255,255,255,.11);position:relative;
 flex-shrink:0;transition:.25s;border:1px solid var(--bd)}
.sw.on{background:var(--accg);border-color:transparent}
.sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .25s var(--e)}
.sw.on i{transform:translateX(19px)}
.seg{display:flex;gap:6px;flex-shrink:0}
.sgb{padding:8px 13px;border-radius:var(--rp);font-size:13px;font-weight:600;background:var(--gl);
 border:1px solid var(--bd);color:var(--t4);transition:.2s}
.sgb.on{background:var(--accg);color:#fff;border-color:transparent}
.acg{display:flex;gap:10px;flex-shrink:0}
.acb{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:.2s}
.acb.on{border-color:#fff;transform:scale(1.1)}

/* ---------- CREATE ---------- */
.steps{display:flex;gap:6px;padding:0 20px 28px}
.stp{flex:1;height:3px;border-radius:var(--rp);background:rgba(255,255,255,.1);overflow:hidden}
.stp>i{display:block;height:100%;width:0;background:var(--accg);border-radius:var(--rp);transition:width .4s var(--eo)}
.stp.on>i,.stp.dn>i{width:100%}
.q{font-family:var(--fd);font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1.22;padding:0 20px 10px}
.qs{font-size:14px;color:var(--t3);padding:0 20px 24px;line-height:1.55}
.inp{width:100%;background:var(--gl);border:1px solid var(--bd);border-radius:var(--r);padding:16px;
 font-size:16px;transition:.2s}
.inp:focus{outline:none;border-color:rgba(133,98,255,.55);background:var(--gl2)}
.inp::placeholder{color:var(--t5)}
textarea.inp{min-height:108px;resize:none;line-height:1.55}
.hint{font-size:13px;color:var(--t5);padding:10px 4px 0}
.areag{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.areab{display:flex;align-items:center;gap:10px;padding:15px 14px;border-radius:var(--r);background:var(--gl);
 border:1.4px solid var(--bd);transition:.2s;text-align:left}
.areab.on{border-color:var(--nc);background:var(--nb)}
.areab-n{font-size:13.5px;font-weight:600}
.foot{position:absolute;left:0;right:0;bottom:0;padding:16px 20px calc(16px + env(safe-area-inset-bottom));
 background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:10}
.mcard{margin:0 0 14px;border-radius:var(--r);border:1px solid var(--bd);background:var(--gl);overflow:hidden}
.mc-h{display:flex;align-items:center;gap:12px;padding:16px 16px 12px}
.mc-i{width:38px;height:38px;border-radius:var(--ro);display:grid;place-items:center;font-size:18px;background:var(--mb)}
.mc-t{font-size:15px;font-weight:600}
.mc-s{font-size:12.5px;color:var(--t4);margin-top:2px}
.mc-b{padding:0 16px 16px}

/* habit */
.hab{display:flex;align-items:center;gap:13px;padding:16px;border-radius:var(--r);background:var(--gl);
 border:1px solid var(--bd);margin-bottom:10px}
.hab-i{width:38px;height:38px;border-radius:var(--ro);display:grid;place-items:center;font-size:16px;
 background:rgba(113,61,255,.16);flex-shrink:0}
.hab-n{font-size:15px;font-weight:600}
.hab-m{font-size:12.5px;color:var(--t4);margin-top:3px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hab-s{font-family:var(--fd);font-weight:700;font-size:16px;color:var(--health);flex-shrink:0}

.empty{text-align:center;padding:46px 30px}
.empty-i{font-size:34px;opacity:.28;margin-bottom:14px}
.empty-t{font-size:16px;font-weight:600}
.empty-s{font-size:14px;color:var(--t4);margin-top:7px;line-height:1.55}
.note{margin:0 20px;padding:15px 16px;border-radius:var(--r);background:rgba(113,61,255,.09);
 border:1px solid rgba(113,61,255,.22);font-size:13.5px;color:var(--t3);line-height:1.55}

/* ---------- TABBAR ---------- */
.tb{display:flex;flex-shrink:0;background:rgba(10,1,24,.86);backdrop-filter:blur(24px);

const $=s=>document.querySelector(s);

function pct(n){const k=n.kids||[];if(!k.length)return n.done?100:0;return Math.round(k.reduce((a,c)=>a+pct(c),0)/k.length);}
function areaPct(id){const g=TREE[id]||[];return g.length?Math.round(g.reduce((a,x)=>a+pct(x),0)/g.length):0;}
function lifePct(){return AREAS.length?Math.round(AREAS.reduce((a,x)=>a+areaPct(x.id),0)/AREAS.length):0;}
function leaves(n,acc=[]){const k=n.kids||[];if(!k.length){acc.push(n);return acc;}k.forEach(c=>leaves(c,acc));return acc;}
function collectHabits(n,acc=[]){if(n.habit&&!acc.some(h=>h.id===n.habit.id))acc.push(n.habit);
 (n.kids||[]).forEach(c=>collectHabits(c,acc));return acc;}
function countGoals(){let c=0;AREAS.forEach(a=>(TREE[a.id]||[]).forEach(g=>{if(pct(g)<100)c++;}));return c;}
function allLeaves(){let d=0,t=0;AREAS.forEach(a=>(TREE[a.id]||[]).forEach(g=>leaves(g).forEach(l=>{t++;if(l.done)d++;})));return{d,t};}
function findNode(id,nodes){for(const n of nodes){if(n.id===id)return n;const f=findNode(id,n.kids||[]);if(f)return f;}return null;}
function nodeById(id){for(const a of AREAS){const f=findNode(id,TREE[a.id]||[]);if(f)return f;}return null;}
function areaOf(id){for(const a of AREAS){if(findNode(id,TREE[a.id]||[]))return a;}return AREAS[0];}
function removeNode(id){for(const a of AREAS){const rm=l=>{const i=l.findIndex(x=>x.id===id);
 if(i>-1){l.splice(i,1);return true;}return l.some(x=>rm(x.kids||[]));};if(rm(TREE[a.id]||[]))return true;}return false;}

let mapT={x:0,y:0,k:1},mapRO=null,NODES=[],magRAF=0;
/* magnetic proximity: nodes grow as the pointer gets closer */
function magnet(cx,cy){
 if(magRAF)return;magRAF=requestAnimationFrame(()=>{magRAF=0;
  const R=140;
  NODES.forEach(n=>{
   const d=Math.hypot(cx-n.x,cy-n.y);
   const t=Math.max(0,1-d/R),e=t*t;
   n.el.style.transform=`translate(-50%,-50%) scale(${(1+.46*e).toFixed(3)})`;
   n.el.style.zIndex=e>.04?String(10+Math.round(e*10)):'';
   n.el.style.borderColor=e>.12?n.c:'';
   n.el.style.boxShadow=e>.12?`0 0 ${(26*e).toFixed(0)}px ${n.c}${e>.5?'66':'33'}`:'';
   n.el.style.background=e>.12?`rgba(255,255,255,${(.05+.06*e).toFixed(3)})`:'';
  });});}
function magReset(){NODES.forEach(n=>{n.el.style.transform='translate(-50%,-50%)';
 n.el.style.zIndex='';n.el.style.borderColor='';n.el.style.boxShadow='';n.el.style.background='';});}
function tapNode(el,x,y,id){
 el.style.transition='transform .16s var(--e)';
 el.style.transform='translate(-50%,-50%) scale(1.5)';
 el.style.zIndex='30';
 zoomTo(x,y,id);}

function initMap(){let t=0;const run=()=>{const w=$('#mw');if(!w||cur().s!=='map')return;
 if(!w.clientWidth&&t++<60){requestAnimationFrame(run);return;}drawMap();};
 run();                      /* сразу — не ждём кадра */
 requestAnimationFrame(run); /* и после раскладки, если ширины ещё не было */}

 if(!document.hidden&&USER.onb&&cur().s==='map')initMap();});
function drawMap(){
 const w=$('#mw'),sv=$('#wires'),nb=$('#mnodes');if(!w||!sv||!nb)return;
 const W=w.clientWidth||390,H=w.clientHeight||426,cx=W/2,cy=H/2-8,R=Math.min(W,H)*.335;
 const cn=esc(CORE.n).toUpperCase();
 let wires='',nodes=`<div class="core" style="left:${cx}px;top:${cy}px" onclick="push('core')">
  <div><div class="core-i">${esc(CORE.ic||'Я')}</div>
  <div class="core-l" style="${cn.length>10?'font-size:7.5px;letter-spacing:.14em':''}">${cn}</div></div></div>`;
 AREAS.forEach((a,i)=>{const ang=-Math.PI/2+i*(Math.PI*2/AREAS.length);
  const x=cx+R*Math.cos(ang),y=cy+R*Math.sin(ang),p=areaPct(a.id),d=`M${cx},${cy} L${x},${y}`;
  wires+=`<path class="wireb" d="${d}" stroke="${a.c}"/><path class="wire" d="${d}" stroke="${a.c}"/>
   <path class="pulse" d="${d}" stroke="${a.c}" style="animation:dash 2.4s linear ${i*.34}s infinite"/>`;
  nodes+=`<div class="node" data-x="${x}" data-y="${y}" data-c="${a.c}"
    style="left:${x}px;top:${y}px;--nc:${a.c};--nb:${a.c}22;--nl:${a.c}55"
    onclick="tapNode(this,${x},${y},'${a.id}')">
   <div class="node-i">${a.ic}</div><div class="node-n">${a.n}</div><div class="node-p">${p}%</div></div>`;});
 sv.innerHTML=wires;nb.innerHTML=nodes;
 NODES=[...nb.querySelectorAll('.node')].map(el=>({el,x:+el.dataset.x,y:+el.dataset.y,c:el.dataset.c}));
 if(!$('#dkf')){const s=document.createElement('style');s.id='dkf';s.textContent='@keyframes dash{to{stroke-dashoffset:-54}}';document.head.appendChild(s);}
 mapT={x:0,y:0,k:1};applyT(true);
 if(mapRO)mapRO.disconnect();
 mapRO=new ResizeObserver(()=>{if(cur().s==='map')drawMap();});mapRO.observe(w);
 let drag=false,sx=0,sy=0,ox=0,oy=0,pts=new Map(),pd=0,pk=1;
 /* Важно: не захватываем указатель на одном пальце — иначе click по узлу не доходит
    и страница перестаёт листаться. Захват только при пинче двумя пальцами. */
 w.onpointerdown=e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=w.getBoundingClientRect();
  magnet((e.clientX-r.left-mapT.x)/mapT.k,(e.clientY-r.top-mapT.y)/mapT.k);
  if(pts.size===1){drag=e.pointerType==='mouse';sx=e.clientX;sy=e.clientY;ox=mapT.x;oy=mapT.y;}
  else if(pts.size===2){drag=false;pts.forEach((_,id)=>{try{w.setPointerCapture(id)}catch(_){}});
   const[a,b]=[...pts.values()];pd=Math.hypot(a.x-b.x,a.y-b.y);pk=mapT.k;}};
 const toCanvas=e=>{const r=w.getBoundingClientRect();
  return{x:(e.clientX-r.left-mapT.x)/mapT.k,y:(e.clientY-r.top-mapT.y)/mapT.k};};
 w.onpointermove=e=>{
  if(!pts.has(e.pointerId)){const p=toCanvas(e);magnet(p.x,p.y);return;}
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
   mapT.k=Math.min(2.4,Math.max(.55,pk*(d/pd)));applyT(true);}
  else if(drag){mapT.x=ox+(e.clientX-sx);mapT.y=oy+(e.clientY-sy);applyT(true);magReset();}
  else{const p=toCanvas(e);magnet(p.x,p.y);}};
 w.onpointerleave=()=>magReset();
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)drag=false;
  /* на тач-экране гасим подсветку с задержкой, чтобы нажатие успело быть видным */
  if(e.pointerType!=='mouse')setTimeout(()=>{if(!pts.size)magReset();},520);};
 w.onpointerup=up;w.onpointercancel=up;
 w.onwheel=e=>{e.preventDefault();mapT.k=Math.min(2.4,Math.max(.55,mapT.k*(e.deltaY>0?.92:1.08)));applyT(true);};
}
function applyT(nt){const c=$('#mc');if(!c)return;c.classList.toggle('nt',!!nt);
 c.style.transform=`translate(${mapT.x}px,${mapT.y}px) scale(${mapT.k})`;}
function zoomTo(x,y,id){const w=$('#mw');if(!w)return;const k=1.75;
 mapT={k,x:w.clientWidth/2-x*k,y:w.clientHeight/2-y*k};applyT(false);
 setTimeout(()=>push('area',{a:id}),380);}

function habTab(hs,n){

   <div class="rows">${[...branches].sort((x,y)=>pct(y)-pct(x)).map(k=>`
    <div class="row" style="--nc:${a.c}"><span class="row-b"><span class="row-n">${esc(k.n)}</span>
     <span class="bar"><i style="width:${pct(k)}%"></i></span></span>

function ring(p,c,size=90){const r=(size-12)/2,C=2*Math.PI*r;
 return `<div class="ring" style="width:${size}px;height:${size}px">
  <svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="8"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"
   stroke-dasharray="${C}" stroke-dashoffset="${C-C*p/100}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>
  <div class="ring-t" style="color:${c}">${p}%</div></div>`;}
function tgNode(id){const n=nodeById(id);n.done=!n.done;render();toast(n.done?'Выполнено ✓':'Отменено');}
async function addKid(id,branch){
 const nm=await askText({title:branch?'Новая подцель':'Новая задача',
  note:branch?'Внутри неё можно создавать ещё подцели — глубина не ограничена.':'Конкретное действие, которое отмечается галочкой.',
  label:'Название',ph:branch?'Например: Зарядка':'Например: Планка 60 секунд',ok:'Добавить'});
 if(!nm||!nm.trim())return;
 const node=nodeById(id);if(!node)return;
 node.kids.push(branch?N(nm.trim(),{kids:[N('Первый шаг')]}):N(nm.trim()));
 render();toast(branch?'Подцель добавлена':'Задача добавлена');}

function sTab(){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth(),td=d.getDate();
 const first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),miss=[2,9,17,23];
 let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="cal-d">${x}</div>`).join('');
 for(let i=0;i<first;i++)cells+='<div class="cal-c e"></div>';
 for(let i=1;i<=dim;i++){let cl='cal-c';if(i===td)cl+=' t';else if(i<td)cl+=miss.includes(i)?' m':' d';
  cells+=`<div class="${cl}">${i}</div>`;}
 const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

   <div class="legend"><span><i style="background:var(--health)"></i>Выполнено</span>
    <span><i style="background:var(--bad)"></i>Пропуск</span>

 if(c.step<6){c.step++;render();return;}
 const kids=(d.subs||[]).map(s=>N(s,{kids:[N('Первый шаг')]}));

 stack=[{s:'area',a:d.area}];render();

/* ============ PWA WIRING ============
 Работает только когда файл открыт напрямую (не внутри iframe артефакта):
 там нет manifest.json/sw.js рядом, и лишних ошибок в консоли быть не должно. */
(function pwa(){
 const standalone = window.self===window.top && location.protocol!=='data:';
 if(!standalone)return;
 try{
  if(!document.querySelector('link[rel="manifest"]')){
   const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);}
  if('serviceWorker' in navigator && location.protocol==='https:'){
   window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
 }catch(e){}
})();

/* BOOT */
load();ready=true;applyAcc();render();
</script>
